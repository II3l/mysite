<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kurd.com - Domain Taken</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.owner {
            color: #9ca3af;
            font-size: 18px;
            margin-bottom: 30px;
        }

        p.owner span {
            color: #ffffff;
            font-weight: 600;
        }

        .contact-box {
            background: #1f2937;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .contact-title {
            font-size: 13px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .phone-number {
            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Unavailable</div>
        <h1>kurd.com</h1>
        <p class="owner">Domain taken by <span>Andy H.</span></p>

        <div class="contact-box">
            <div class="contact-title">Contact Information</div>
            <a href="tel:+9647702488282" class="phone-number">+964 770 248 8282</a>
        </div>

        <a href="tel:+9647702488282" class="btn">Call Now</a>
    </div>

</body>
</html>
